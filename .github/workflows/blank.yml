name: Build RootScope APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          unzip -o RootScope-Android-project.zip -d /tmp/rootscope

          PROJECT_DIR="$(find /tmp/rootscope -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Не найдена папка app/ в архиве"
            find /tmp/rootscope -maxdepth 4 -print
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          if not p.is_file():
              raise SystemExit("Не найден app/build.gradle.kts")

          s = p.read_text()

          def replace_block(text, name, body):
              match = re.search(r'(?m)^[ \t]*' + re.escape(name) + r'[ \t]*\{', text)
              if match:
                  start = match.start()
                  brace = text.find("{", match.start())
                  depth = 0
                  end = None
                  for i in range(brace, len(text)):
                      if text[i] == "{":
                          depth += 1
                      elif text[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break
                  if end is None:
                      raise SystemExit("Не удалось разобрать блок " + name)
                  return text[:start] + body + text[end:]

              android = re.search(r'(?m)^[ \t]*android[ \t]*\{', text)
              if not android:
                  raise SystemExit("Не найден блок android {")
              brace = text.find("{", android.start())
              depth = 0
              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[:i] + "\n\n" + body + "\n" + text[i:]
              raise SystemExit("Не удалось разобрать блок android")

          s = replace_block(s, "compileOptions", """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""")

          s = replace_block(s, "kotlinOptions", """    kotlinOptions {
                  jvmTarget = "17"
              }""")

          p.write_text(s)
          print("Java и Kotlin настроены на JVM 17.")
          PY

      - name: Fix MainActivity
        shell: bash
        run: |
          FILE="app/src/main/java/com/rootscope/scanner/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "::error::Не найден $FILE"
            find app/src -name 'MainActivity.kt' -print
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/rootscope/scanner/MainActivity.kt")
          s = p.read_text()

          if "registerForActivityResult" not in s:
              raise SystemExit("Не найден registerForActivityResult — проверь исходный файл")

          s = re.sub(
              r'(?m)^import android\.app\.Activity\s*$\n?',
              '',
              s
          )

          if not re.search(r'(?m)^import androidx\.activity\.ComponentActivity\s*$', s):
              package = re.search(r'(?m)^package .*$', s)
              if package:
                  pos = package.end()
                  s = s[:pos] + "\n\nimport androidx.activity.ComponentActivity" + s[pos:]
              else:
                  s = "import androidx.activity.ComponentActivity\n" + s

          s, count = re.subn(
              r'(\bclass\s+MainActivity\s*:\s*)Activity\s*\(',
              r'\1ComponentActivity(',
              s,
              count=1
          )

          if count == 0 and "class MainActivity : ComponentActivity(" not in s:
              raise SystemExit("Не удалось изменить базовый класс MainActivity")

          p.write_text(s)
          print("MainActivity настроен на ComponentActivity.")
          PY

      - name: Check project structure
        run: |
          test -f settings.gradle.kts
          test -d app
          gradle --no-daemon projects

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
