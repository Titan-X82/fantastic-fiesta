- name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -o RootScope-Android-project.zip -d /tmp/rootscope

          PROJECT_DIR="$(find /tmp/rootscope -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Не найдена папка app/ внутри RootScope-Android-project.zip"
            echo "Содержимое архива:"
            find /tmp/rootscope -maxdepth 4 -print
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Check project structure
        run: |
          echo "Корень репозитория:"
          ls -la

          if [ ! -f settings.gradle.kts ] || [ ! -d app ]; then
            echo "::error::В корне проекта отсутствует settings.gradle.kts или app/"
            exit 1
          fi

          echo "Найден Android-модуль app/"
          gradle --no-daemon projects

      - name: Build APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
