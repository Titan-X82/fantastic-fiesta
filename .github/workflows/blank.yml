name: Build RootScope APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "RootScope-Android-project.zip" ]; then
            echo "::error::Не найден RootScope-Android-project.zip в корне репозитория"
            exit 1
          fi

          mkdir -p /tmp/rootscope
          unzip -o RootScope-Android-project.zip -d /tmp/rootscope

          PROJECT_DIR="$(find /tmp/rootscope -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Не найдена папка app/ в архиве"
            find /tmp/rootscope -maxdepth 5 -print
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          def find_block(text, name):
              match = re.search(
                  r'(?m)^[ \t]*' + re.escape(name) + r'[ \t]*\{',
                  text
              )
              if not match:
                  return None

              brace = text.find("{", match.start())
              depth = 0

              for i in range(brace, len(text)):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return match.start(), i + 1

              raise SystemExit("Не удалось разобрать блок " + name)

          def replace_or_insert(text, name, body):
              bounds = find_block(text, name)

              if bounds:
                  start, end = bounds
                  return text[:start] + body + text[end:]

              android = find_block(text, "android")
              if not android:
                  raise SystemExit("Не найден блок android {}")

              _, end = android
              return text[:end - 1] + "\n\n" + body + "\n" + text[end - 1:]

          s = replace_or_insert(
              s,
              "compileOptions",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }"""
          )

          s = replace_or_insert(
              s,
              "kotlinOptions",
              """    kotlinOptions {
                  jvmTarget = "17"
              }"""
          )

          p.write_text(s)
          print("Java и Kotlin настроены на JVM 17.")
          PY

      - name: Add AndroidX Activity dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if re.search(r'androidx\.activity:activity(?:-ktx)?:', s):
              print("Зависимость AndroidX Activity уже есть.")
          else:
              match = re.search(r'\bdependencies\s*\{', s)

              if match:
                  brace = s.find("{", match.start())
                  depth = 0
                  end = None

                  for i in range(brace, len(s)):
                      if s[i] == "{":
                          depth += 1
                      elif s[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i
                              break

                  if end is None:
                      raise SystemExit("Блок dependencies не закрыт.")

                  s = (
                      s[:end]
                      + '\n    implementation("androidx.activity:activity-ktx:1.10.1")\n'
                      + s[end:]
                  )
              else:
                  s += (
                      '\n\ndependencies {\n'
                      '    implementation("androidx.activity:activity-ktx:1.10.1")\n'
                      '}\n'
                  )

              p.write_text(s)
              print("Добавлена зависимость AndroidX Activity.")
          PY

      - name: Fix MainActivity
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/rootscope/scanner/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "::error::Не найден $FILE"
            find app/src -name 'MainActivity.kt' -print
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/rootscope/scanner/MainActivity.kt")
          s = p.read_text()

          if "registerForActivityResult" not in s:
              raise SystemExit("Не найден registerForActivityResult в MainActivity.kt")

          s = re.sub(
              r'(?m)^import android\.app\.Activity[ \t]*\n?',
              '',
              s
          )

          imports = [
              "androidx.activity.ComponentActivity",
              "androidx.activity.result.contract.ActivityResultContracts",
          ]

          for item in imports:
              pattern = r'(?m)^import ' + re.escape(item) + r'[ \t]*$'

              if not re.search(pattern, s):
                  package = re.search(r'(?m)^package .*$', s)

                  if package:
                      pos = package.end()
                      s = s[:pos] + "\n\nimport " + item + s[pos:]
                  else:
                      s = "import " + item + "\n" + s

          s, count = re.subn(
              r'(\bclass\s+MainActivity\s*:\s*)Activity\s*\(',
              r'\1ComponentActivity(',
              s,
              count=1
          )

          if count == 0 and not re.search(
              r'\bclass\s+MainActivity\s*:\s*ComponentActivity\s*\(',
              s
          ):
              raise SystemExit("Не удалось изменить базовый класс MainActivity")

          p.write_text(s)
          print("Импорты и базовый класс MainActivity обновлены.")
          PY

      - name: Check project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src
          gradle --no-daemon projects

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
