name: Build RootScope APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.6"

      
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check project structure
        run: |
          echo "Repository root:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Build APK
        run: |
          gradle --no-daemon projects
          gradle --no-daemon assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
